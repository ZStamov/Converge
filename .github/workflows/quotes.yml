name: Live quotes (every minute)

# One long-running job publishes quotes every minute and the market pulse every 5 minutes during US market hours
# (the script sleeps when the market is closed). GitHub's scheduler drops most frequent cron runs, so each run
# starts the next one itself when it ends; the cron entries below only restart the chain if it ever breaks.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-quotes.mjs', 'scripts/lib/pulse.mjs', '.github/workflows/quotes.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: live-quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Quotes every minute, market pulse every 5 minutes
        run: node scripts/fetch-quotes.mjs quotes-out 19800
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the next run
        if: always() && github.ref == 'refs/heads/main'
        run: gh workflow run quotes.yml -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
