name: Refresh market data

on:
  schedule:
    - cron: '17 * * * *'   # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-data.mjs', 'scripts/fetch-scanner.mjs', 'scripts/tts.py', 'scripts/lib/**', 'config/**', '.github/workflows/data.yml']

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore state from the data and audio branches
        run: |
          mkdir -p data-out audio-out
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth=1 origin data
            for f in history.json prices-cache.json; do git show "origin/data:$f" > "data-out/$f" 2>/dev/null || rm -f "data-out/$f"; done
          fi
          if git ls-remote --exit-code --heads origin audio >/dev/null; then
            git fetch -q --depth=1 origin audio
            git archive origin/audio | tar -x -C audio-out
          fi
          ls data-out audio-out | head -5

      - name: News, prices, sentiment and signals
        run: |
          set -o pipefail
          node scripts/fetch-data.mjs data-out 2>&1 | tee data.log

      - name: Scanner (S&P 500)
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/fetch-scanner.mjs data-out 2>&1 | tail -n 40 | tee -a data.log

      - name: Cache neural voice
        uses: actions/cache@v4
        with:
          path: ~/.kokoro
          key: kokoro-v1.0-fp16

      - name: Briefing audio (Kokoro neural voice)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ~/.kokoro
          R=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f ~/.kokoro/kokoro-v1.0.fp16.onnx ] || curl -fsSL "$R/kokoro-v1.0.fp16.onnx" -o ~/.kokoro/kokoro-v1.0.fp16.onnx
          [ -f ~/.kokoro/voices-v1.0.bin ] || curl -fsSL "$R/voices-v1.0.bin" -o ~/.kokoro/voices-v1.0.bin
          pip install -q kokoro-onnx lameenc
          VOICE=$(node -p "require('./config/universe.json').briefingVoice || 'af_heart'")
          python scripts/tts.py data-out audio-out ~/.kokoro/kokoro-v1.0.fp16.onnx ~/.kokoro/voices-v1.0.bin "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/audio/" "$VOICE" 2>&1 | tail -n 20 | tee -a data.log

      - name: Publish audio, then data
        run: |
          push_dir () {
            (cd "$1" && git init -q -b "$2" && git config user.name "converge-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
              && git add -A && git commit -qm "$2 $(date -u +%FT%TZ)" && git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$2")
          }
          if ls audio-out/*.mp3 >/dev/null 2>&1; then push_dir audio-out audio; fi
          push_dir data-out data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report status
        if: always()
        run: bash scripts/ci-report.sh data "${{ job.status }}" data.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
