name: Refresh market data

on:
  schedule:
    - cron: '7,37 13-21 * * 1-5'   # every 30 min, US market hours (UTC)
    - cron: '23 1 * * *'           # once overnight, every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-data.mjs', 'scripts/sec-probe.mjs', 'scripts/lib/**', 'config/**', '.github/workflows/data.yml']

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore history from the data branch
        run: |
          mkdir -p data-out
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth=1 origin data
            git show origin/data:history.json > data-out/history.json 2>/dev/null || true
          fi

      - name: Fetch sources and compute signals
        run: |
          set -o pipefail
          node scripts/sec-probe.mjs 2>&1 | tee data.log
          for ua in "Converge Research admin@converge-app.dev" "Mozilla/5.0 (compatible; Converge/1.0; +https://github.com/${GITHUB_REPOSITORY})"; do
            echo "sec-probe curl [$ua] -> $(curl -s -o /dev/null -w '%{http_code}' -A "$ua" https://data.sec.gov/submissions/CIK0000320193.json)" | tee -a data.log
          done
          node scripts/fetch-data.mjs data-out 2>&1 | tee -a data.log

      - name: Publish to the data branch
        run: |
          cd data-out
          git init -q -b data
          git config user.name "converge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json history.json
          git commit -qm "Market data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report status
        if: always()
        run: bash scripts/ci-report.sh data "${{ job.status }}" data.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
