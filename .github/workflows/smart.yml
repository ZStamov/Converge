name: Politicians, funds and insiders

on:
  schedule:
    - cron: '25 */4 * * *'   # filings trickle in all day; Nasdaq pages refresh about daily per stock
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-smart.mjs', 'scripts/lib/congress.mjs', '.github/workflows/smart.yml']

permissions:
  contents: write

concurrency:
  group: smart-money
  cancel-in-progress: false

jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: which pdftotext || (sudo apt-get update -q && sudo apt-get install -y -q poppler-utils)
      - name: Restore the smart branch
        run: |
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" smart >/dev/null; then git clone -q --depth 1 --branch smart "$url" smart-out; rm -rf smart-out/.git; else mkdir smart-out; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Congress filings, 13F holders, insider trades
        run: node scripts/fetch-smart.mjs smart-out 2880 2>&1 | tee smart.log
      - name: Publish (single commit, history not kept)
        run: |
          cd smart-out
          git init -q -b smart
          git config user.name "converge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Smart money $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" smart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report
        if: always()
        run: bash scripts/ci-report.sh smart "${{ job.status }}" smart.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
