name: Market pulse (one-off; the live-quotes job refreshes it every 5 min)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-pulse.mjs', '.github/workflows/pulse.yml']

permissions:
  contents: write

concurrency:
  group: market-pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch 5-minute bars
        run: node scripts/fetch-pulse.mjs pulse-out
      - name: Publish to the pulse branch
        run: |
          cd pulse-out
          git init -q -b pulse
          git config user.name "converge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulse.json
          git commit -qm "Pulse $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pulse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
